name: Publish Plugin to Prusa Marketplace

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean bundle for Marketplace archive-policy
        run: |
          rm -f .gitignore pack_plugin.bat *.bat *.cmd *.sh *.ps1 LICENSE
          find . -maxdepth 2 -type f ! -name "*.lua" ! -name "*.json" ! -name "*.stl" ! -name "*.svg" ! -name "*.png" ! -name "*.md" ! -name "*.txt" ! -path "./.github/*" -exec rm -f {} +

      - name: Publish to Prusa Plugin Marketplace
        uses: prusa3d/plugin-marketplace-publish@v1
        with:
          private-key: ${{ secrets.PRUSA_SLICER_PLUGIN_MARKETPLACE_SIGNING_KEY }}
