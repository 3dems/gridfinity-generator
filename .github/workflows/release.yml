name: Publish Plugin to Prusa Marketplace

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove local development scripts (Marketplace archive-policy)
        run: rm -f pack_plugin.bat *.bat *.cmd *.sh *.ps1

      - name: Publish to Prusa Plugin Marketplace
        uses: prusa3d/plugin-marketplace-publish@v1
        with:
          private-key: ${{ secrets.PRUSA_SLICER_PLUGIN_MARKETPLACE_SIGNING_KEY }}
